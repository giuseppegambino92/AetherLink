[package]
name = "aether-capture"
description = "AetherLink screen capture: ScreenCaptureKit (macOS) + deterministic test pattern source"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aether-protocol.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-audio-types = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal ScreenCast (zbus 5 on its async-io executor; no tokio feature so zbus's
# blocking API keeps working inside tokio contexts elsewhere in the workspace).
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
futures = { workspace = true }
# v0_3_34: pw_stream_trigger_process (PipeWire >= 0.3.34, 2021).
pipewire = { version = "0.10", features = ["v0_3_34"] }
x11rb = { version = "0.14", features = ["shm", "randr", "xfixes", "composite"] }
libc = "0.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
