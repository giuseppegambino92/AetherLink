[package]
name = "aether-codec"
description = "AetherLink codecs: lossless dirty-tile codec, VideoToolbox H.264/HEVC, Annex-B/AVCC helpers, hybrid scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aether-protocol.workspace = true
aether-capture.workspace = true
thiserror.workspace = true
tracing.workspace = true
zstd.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde.workspace = true
# libopus 1.3.1 translated to Rust (c2rust): no C toolchain/cmake needed on any target.
unsafe-libopus = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Software H.264: the `source` feature compiles OpenH264 from the vendored sources with `cc`
# (C++ + NEON .S on aarch64; optional NASM on x86) — no system library needed at runtime.
openh264 = { version = "0.9.10", default-features = false, features = ["source"] }
# Raw option structs/constants for runtime bitrate changes (`ENCODER_OPTION_BITRATE`).
openh264-sys2 = { version = "0.9.10", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
