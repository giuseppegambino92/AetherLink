[package]
name = "aether-display"
description = "AetherLink host display control: Ghost Mode privacy curtain, backlight control, headless virtual displays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["std", "NSArray", "NSDate", "NSRunLoop", "NSString", "NSGeometry", "NSThread"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindowLevel", "CGError"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSScreen", "NSColor", "NSApplication", "NSResponder", "NSGraphics", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "shape"] }
# systemd-logind SetBrightness. zbus on its async-io executor (no tokio feature), like the rest
# of the workspace, so the blocking API also works when called from inside a tokio runtime.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
