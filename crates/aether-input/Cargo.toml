[package]
name = "aether-input"
description = "AetherLink input injection (CGEvent / SendInput / uinput), HID keymaps, HID report generation and OS permission helpers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aether-protocol.workspace = true
thiserror.workspace = true
serde.workspace = true

# HID dongle bridge (bt_hid::serial); no libudev (Linux enumerates via sysfs).
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
serialport = { version = "4.10", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSObject", "NSString", "NSValue"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "Bluetooth",
    "IOBluetoothDevice",
    "IOBluetoothHostController",
    "IOBluetoothL2CAPChannel",
    "IOBluetoothObject",
    "IOBluetoothSDPServiceRecord",
    "IOBluetoothUserLib",
    "IOBluetoothUserNotification",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Linux injection fallbacks (linux_backend): XTest and the RemoteDesktop portal.
x11rb = { version = "0.14", features = ["xtest"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
futures = { workspace = true }
tracing = { workspace = true }
# BlueZ D-Bus (bt_hid::linux), pure Rust: no libdbus.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
serde_json.workspace = true
