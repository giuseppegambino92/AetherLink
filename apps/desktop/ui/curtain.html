<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Ghost Mode privacy curtain: intentionally text-free (nothing to localize, nothing to leak). -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; cursor: none; overflow: hidden; }
      .mark {
        position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px;
        border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 60px rgba(120, 160, 255, 0.06) inset;
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe { 50% { opacity: 0.35; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body><div class="mark"></div></body>
</html>
