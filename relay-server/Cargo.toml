[package]
name = "aether-relay"
description = "AetherLink rendezvous + zero-knowledge UDP relay server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aether_relay"
path = "src/lib.rs"

[[bin]]
name = "aether-relay"
path = "src/main.rs"

[dependencies]
aether-protocol.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
blake3.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
subtle = "2.6"

[dev-dependencies]
aether-net = { path = "../crates/aether-net" }
tokio = { workspace = true, features = ["full", "test-util"] }
